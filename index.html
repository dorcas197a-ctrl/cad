<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Web CAD / GIS</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Barra Lateral */
        .sidebar {
            width: 280px;
            background: #1e293b;
            color: #f8fafc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
        }
        .sidebar h2 { font-size: 1.1rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .tool-group { display: flex; flex-direction: column; gap: 8px; }
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .tool-btn:hover { background: #475569; }
        .tool-btn.active { background: #0284c7; border-color: #38bdf8; }
        .tool-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Mapa */
        #map { flex: 1; height: 100%; background: #0f172a; }

        /* Select de Mapas */
        select.map-select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            outline: none;
        }

        /* Indicador de Snap */
        .snap-status {
            font-size: 0.8rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <aside class="sidebar">
        <h2>Capas de Mapas</h2>
        <select id="layerSelect" class="map-select" onchange="changeBaseLayer(this.value)">
            <option value="bing">Bing Satélite</option>
            <option value="apple">Apple / Esri World Imagery</option>
            <option value="yahoo">Yahoo / CartoDB Dark</option>
            <option value="osm">OpenStreetMap Estándar</option>
        </select>

        <h2>Herramientas CAD</h2>
        <div class="tool-group">
            <!-- Icono Punta de Rapidógrafo -->
            <button class="tool-btn" id="btn-draw" onclick="setActiveTool('draw')">
                <svg viewBox="0 0 24 24">
                    <path d="M7,2 17,2 15,9 13,9 13,18 11.5,22 10,18 10,9 8,9 Z"/>
                </svg>
                Trazar Polígono (Rapidógrafo)
            </button>

            <!-- Icono Regla de Medición Mejorada -->
            <button class="tool-btn" id="btn-measure" onclick="setActiveTool('measure')">
                <svg viewBox="0 0 24 24">
                    <path d="M19,4H5C3.89,4 3,4.89 3,6V18C3,19.1 3.89,20 5,20H19C20.1,20 21,19.1 21,18V6C21,4.89 20.1,4 19,4M19,8H17V6H19V8M15,10H13V6H15V10M11,8H9V6H11V8M7,12H5V6H7V12Z"/>
                </svg>
                Medir Distancia (Regla CAD)
            </button>

            <!-- Herramienta Mover -->
            <button class="tool-btn" id="btn-move" onclick="setActiveTool('move')">
                <svg viewBox="0 0 24 24">
                    <path d="M13,6V11H18V9L22,12L18,15V13H13V18H15L12,22L9,18H11V13H6V15L2,12L6,9V11H11V6H9L12,2L15,6H13Z"/>
                </svg>
                Mover / Editar Vértices
            </button>
        </div>

        <h2>Opciones de Ajuste</h2>
        <div class="snap-status">
            <input type="checkbox" id="snapToggle" checked>
            <label for="snapToggle">Snap Magnético (Cerrar)</label>
        </div>
    </aside>

    <div id="map"></div>
</div>

<!-- Leaflet & Extensions -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    L.control.zoom({ position: 'topright' }).addTo(map);
